version: "2"
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
    gofumpt:
      extra:
        group-params: true
      module-path: github.com/supabase-community/scim-go
linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - dupl
    - errname
    - errorlint
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - makezero
    - modernize
    - musttag
    - nestif
    # - nilerr
    - nolintlint
    - revive
    - testifylint
  settings:
    dupl:
      threshold: 150
    funlen:
      lines: 60
      statements: 40
      ignore-comments: true
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
    nestif:
      min-complexity: 4
    revive:
      rules:
        - name: argument-limit
          arguments: [4]
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - dupl
          - funlen
          - goconst
          - gosec
          - revive
      - linters:
          - revive
        text: "should have comment or be unexported"
      - linters:
          - revive
        text: "comment on exported .* should be of the form"
