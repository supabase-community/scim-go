version: "2"
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
    gofumpt:
      extra:
        group-params: true
      module-path: github.com/supabase-community/scim-go
linters:
  default: standard
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - contextcheck
    - dupl
    - durationcheck
    - errname
    - errorlint
    - fatcontext
    - funcorder
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - gosec
    - intrange
    - makezero
    - mirror
    - modernize
    - musttag
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - sqlclosecheck
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    dupl:
      threshold: 150
    funcorder:
      constructor: true
      struct-method: true
      alphabetical: false
      function: true
    funlen:
      lines: 60
      statements: 40
      ignore-comments: true
    gocognit:
      min-complexity: 10
    gocyclo:
      min-complexity: 10
    nilnil:
      checked-types:
        - ptr
        - func
        - map
        - chan
    nestif:
      min-complexity: 4
    revive:
      rules:
        - name: argument-limit
          arguments: [4]
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - dupl
          - funlen
          - goconst
          - gocognit
          - gocyclo
          - gosec
          - revive
